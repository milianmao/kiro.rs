name: Build and Push Container Images

on:
  push:
    branches:
      - master
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
      - 'config.example.json'
      - '.vscode/**'
      - '.idea/**'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag for Docker images (e.g., 0.1.0)'
        required: true
        default: '0.1.0'

permissions:
  contents: read
  packages: write

jobs:
  pre-check:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.check.outputs.should_build }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        with:
          fetch-depth: 0
      - name: Skip build when commit already has release tag
        id: check
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref }}" == refs/heads/* ]] && git tag --points-at HEAD | grep -q '^v'; then
            echo "should_build=false" >> $GITHUB_OUTPUT
            echo "::notice::Skipping beta build: commit already has a release tag"
          else
            echo "should_build=true" >> $GITHUB_OUTPUT
          fi

  build:
    needs: pre-check
    if: needs.pre-check.outputs.should_build == 'true'
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-22.04-arm
            arch: arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve image repos
        id: repo
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPO_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          OWNER_LC="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=ghcr.io/${OWNER_LC}/kiro-rs" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            NAMESPACE="${DOCKERHUB_NAMESPACE:-$OWNER_LC}"
            echo "dockerhub_image=${NAMESPACE}/kiro-rs" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_image=" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            echo "version=${RAW_VERSION#v}" >> $GITHUB_OUTPUT
            echo "is_beta=false" >> $GITHUB_OUTPUT
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
            echo "version=beta-${SHORT_SHA}" >> $GITHUB_OUTPUT
            echo "is_beta=true" >> $GITHUB_OUTPUT
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.repo.outputs.dockerhub_enabled == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Compose image tags
        id: tags
        env:
          GHCR_IMAGE: ${{ steps.repo.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.repo.outputs.dockerhub_image }}
          DOCKERHUB_ENABLED: ${{ steps.repo.outputs.dockerhub_enabled }}
          VERSION: ${{ steps.version.outputs.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          {
            echo "tags<<EOF"
            echo "${GHCR_IMAGE}:${VERSION}-${ARCH}"
            if [ "$DOCKERHUB_ENABLED" = "true" ]; then
              echo "${DOCKERHUB_IMAGE}:${VERSION}-${ARCH}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          push: true
          provenance: false
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Kiro.rs Docker Image

  manifest:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Resolve image repos and version
        id: meta
        env:
          DOCKERHUB_NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE }}
          REPO_OWNER: ${{ github.repository_owner }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          OWNER_LC="$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')"
          echo "ghcr_image=ghcr.io/${OWNER_LC}/kiro-rs" >> "$GITHUB_OUTPUT"
          if [ -n "$DOCKERHUB_USERNAME" ]; then
            NAMESPACE="${DOCKERHUB_NAMESPACE:-$OWNER_LC}"
            echo "dockerhub_image=${NAMESPACE}/kiro-rs" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "dockerhub_image=" >> "$GITHUB_OUTPUT"
            echo "dockerhub_enabled=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
            echo "version=${RAW_VERSION#v}" >> "$GITHUB_OUTPUT"
            echo "is_beta=false" >> "$GITHUB_OUTPUT"
          else
            SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-6)
            echo "version=beta-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
            echo "is_beta=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: ${{ steps.meta.outputs.dockerhub_enabled == 'true' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        uses: docker/login-action@v3
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push multi-arch manifests
        env:
          GHCR_IMAGE: ${{ steps.meta.outputs.ghcr_image }}
          DOCKERHUB_IMAGE: ${{ steps.meta.outputs.dockerhub_image }}
          DOCKERHUB_ENABLED: ${{ steps.meta.outputs.dockerhub_enabled }}
          VERSION: ${{ steps.meta.outputs.version }}
          IS_BETA: ${{ steps.meta.outputs.is_beta }}
        run: |
          set -euo pipefail

          docker manifest create "${GHCR_IMAGE}:${VERSION}" \
            "${GHCR_IMAGE}:${VERSION}-amd64" \
            "${GHCR_IMAGE}:${VERSION}-arm64"
          docker manifest push "${GHCR_IMAGE}:${VERSION}"

          if [ "${IS_BETA}" != "true" ]; then
            docker manifest create "${GHCR_IMAGE}:latest" \
              "${GHCR_IMAGE}:${VERSION}-amd64" \
              "${GHCR_IMAGE}:${VERSION}-arm64"
            docker manifest push "${GHCR_IMAGE}:latest"
          else
            docker manifest create "${GHCR_IMAGE}:beta" \
              "${GHCR_IMAGE}:${VERSION}-amd64" \
              "${GHCR_IMAGE}:${VERSION}-arm64"
            docker manifest push "${GHCR_IMAGE}:beta"
          fi

          if [ "${DOCKERHUB_ENABLED}" = "true" ]; then
            docker manifest create "${DOCKERHUB_IMAGE}:${VERSION}" \
              "${DOCKERHUB_IMAGE}:${VERSION}-amd64" \
              "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
            docker manifest push "${DOCKERHUB_IMAGE}:${VERSION}"

            if [ "${IS_BETA}" != "true" ]; then
              docker manifest create "${DOCKERHUB_IMAGE}:latest" \
                "${DOCKERHUB_IMAGE}:${VERSION}-amd64" \
                "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
              docker manifest push "${DOCKERHUB_IMAGE}:latest"
            else
              docker manifest create "${DOCKERHUB_IMAGE}:beta" \
                "${DOCKERHUB_IMAGE}:${VERSION}-amd64" \
                "${DOCKERHUB_IMAGE}:${VERSION}-arm64"
              docker manifest push "${DOCKERHUB_IMAGE}:beta"
            fi
          fi
